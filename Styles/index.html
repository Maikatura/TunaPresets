<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing</title>
    <!-- Base layout (no framework needed, OBS-safe). Theme CSS layers on top. -->
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="fonts/nunito.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="now-playing hidden" role="status" aria-live="polite" aria-label="Now playing">
        <div class="cover-background" aria-hidden="true"></div>
        <div class="blur-wrapper" aria-hidden="true"></div>
        <div class="cover-container">
            <img id="coverImage" src="" alt="Album Cover">
        </div>
        <div class="details">
            <h1 id="title">Title</h1>
            <p id="artists">Artists</p>
            <p id="album" style="display:none"></p>
        </div>
        <div class="progress" id="progress" style="display:none" aria-hidden="true"><div id="progressFill"></div></div>
    </div>

    <script src="scripts/animations.js"></script>
    <script src="scripts/globals.js"></script>
    <script src="scripts/styles.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
